# /etc/ifstated.conf

# -------------------------------------------------------------------------
# Probe: Runs our fast probe script every 1 second
# -------------------------------------------------------------------------
primary_ok = '( "/bin/sh /etc/ifstated-probe.sh" every 1 )'

# -------------------------------------------------------------------------
# Initial State
# -------------------------------------------------------------------------
init-state auto

state auto {
    if $primary_ok {
        set-state primary
    }
    if ! $primary_ok {
        set-state backup
    }
}

# -------------------------------------------------------------------------
# Primary State (pppoe0)
# -------------------------------------------------------------------------
state primary {
    init {
        run "logger -t ifstated 'STATE CHANGE: Primary link (pppoe0) UP. Switching to primary.'"
        
        # 1. Purge backup default route
        run "route delete default >/dev/null 2>&1"
        
        # 2. Add dynamic PPPoE default route
        run "GW=$(ifconfig pppoe0 | awk '/inet / {print $4}'); if [ -n \"$GW\" ]; then route add default -ifp pppoe0 \"$GW\"; fi >/dev/null 2>&1"
        
        # 3. ROUTE DETECTION & REPORTING
        run "ROUTES=$(route -n show -inet | awk '$1 == \"default\" {printf \"[GW: %s on %s (Flags: %s)] \", $2, $8, $3}'); if [ -z \"$ROUTES\" ]; then logger -t ifstated_route 'WARNING: No default route found in kernel table!'; else logger -t ifstated_route \"ACTIVE ROUTE: $ROUTES\"; fi"
        
        # 4. Kill only backup WAN states (preserves LAN SSH)
        run "BAK_IP=$(ifconfig axen0 | awk '/inet / {print $2}'); if [ -n \"$BAK_IP\" ]; then pfctl -k \"$BAK_IP\"; fi >/dev/null 2>&1"
        
        run "rcctl restart ntpd >/dev/null 2>&1"
    }

    if ! $primary_ok {
        run "logger -t ifstated 'STATE CHANGE: Primary link DOWN. Failing over to backup (axen0).'"
        set-state backup
    }
}

# -------------------------------------------------------------------------
# Backup State (axen0)
# -------------------------------------------------------------------------
state backup {
    init {
        run "logger -t ifstated 'STATE CHANGE: Backup link (axen0) ACTIVE. Primary DOWN.'"
        
        # 1. Purge primary default route
        run "route delete default >/dev/null 2>&1"
        
        # 2. Add backup default route
        run "route add default -ifp axen0 192.168.1.1 >/dev/null 2>&1"
        
        # 3. ROUTE DETECTION & REPORTING
        run "ROUTES=$(route -n show -inet | awk '$1 == \"default\" {printf \"[GW: %s on %s (Flags: %s)] \", $2, $8, $3}'); if [ -z \"$ROUTES\" ]; then logger -t ifstated_route 'WARNING: No default route found in kernel table!'; else logger -t ifstated_route \"ACTIVE ROUTE: $ROUTES\"; fi"
        
        # 4. Kill only primary WAN states (preserves LAN SSH)
        run "EXT_IP=$(ifconfig pppoe0 | awk '/inet / {print $2}'); if [ -n \"$EXT_IP\" ]; then pfctl -k \"$EXT_IP\"; fi >/dev/null 2>&1"
        
        run "rcctl restart ntpd >/dev/null 2>&1"
    }

    if $primary_ok {
        run "logger -t ifstated 'STATE CHANGE: Primary RECOVERED. Restoring primary.'"
        set-state primary
    }
}
