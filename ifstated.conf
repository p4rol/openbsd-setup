# /etc/ifstated.conf

# -------------------------------------------------------------------------
# Robust Probe: 
# 1. Checks em0 is UP (admin state)
# 2. Checks em0 has carrier (physical cable state)
# 3. Only if both are true, it pings Google
# -------------------------------------------------------------------------
primary_ok = '( "ifconfig em0 | grep -q \"<UP,\" && ifconfig em0 | grep -q \"status: active\" && ping -q -c 1 -w 1 8.8.8.8 >/dev/null" every 1 )'

init-state auto

state auto {
    if $primary_ok {
        set-state primary
    }
    if ! $primary_ok {
        set-state backup
    }
}

# -------------------------------------------------------------------------
# Primary State (pppoe0)
# -------------------------------------------------------------------------
state primary {
    init {
        run "logger -t ifstated 'STATE CHANGE: Primary link (pppoe0) UP. Switching to primary.'"
        run "route change default -ifp pppoe0 0.0.0.1 >/dev/null 2>&1"
        run "pfctl -F states >/dev/null 2>&1"
    }

    if ! $primary_ok {
        run "logger -t ifstated 'STATE CHANGE: Primary link DOWN. Failing over to backup (axen0).'"
        set-state backup
    }
}

# -------------------------------------------------------------------------
# Backup State (axen0)
# -------------------------------------------------------------------------
state backup {
    init {
        run "logger -t ifstated 'STATE CHANGE: Backup link (axen0) ACTIVE. Primary DOWN.'"
        run "route change default -ifp axen0 192.168.1.1 >/dev/null 2>&1"
        run "pfctl -F states >/dev/null 2>&1"
    }

    if $primary_ok {
        run "logger -t ifstated 'STATE CHANGE: Primary RECOVERED. Switching back to primary.'"
        set-state primary
    }
}
