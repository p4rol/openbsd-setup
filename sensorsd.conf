# ==============================================================================
# File: /etc/sensorsd.conf
# Purpose: Configuration file for sensorsd(8) hardware monitoring daemon.
#          Monitors hw.sensors state transitions and triggers custom actions.
# ==============================================================================

# ------------------------------------------------------------------------------
# GPS Dongle (nmea0) Monitoring for ntpd
# ------------------------------------------------------------------------------
# Monitor the GPS fix indicator status. The nmea(4) line discipline automatically 
# updates this sensor's state to OK (fix), WARN, or CRITICAL (no fix/disconnected).
# 
# Syntax: sensor:type:command
#   - sensor:  hw.sensors.nmea0.indicator0
#   - type:    status (watch for state changes rather than high/low thresholds)
#   - command: The script to execute when a state transition occurs.
#
# Argument Tokens injected into the command:
#   %2 : The sensor's current reading/value (e.g., "On" or "Off")
#   %s : The sensor's new status state (e.g., "OK", "WARN", "CRITICAL")
# ------------------------------------------------------------------------------

hw.sensors.nmea0.indicator0:status:command=/usr/local/bin/gps_alert.sh hw.sensors.nmea0.indicator0 "%2" "%s"
